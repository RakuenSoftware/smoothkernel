name: Release

# SmoothKernel publishes the kernel + OpenZFS .deb artifacts that every
# Smooth* flavour (SmoothNAS, SmoothRouter, SmoothHTPC, SmoothDesktop)
# installs. Building happens once per supported Debian architecture per
# SmoothKernel commit; consuming repos download the published assets.
#
# Triggers:
#   - push to main: every kernel/patch/config change publishes a new
#     prerelease tagged v<KERNEL_VERSION>-<short-sha>.
#   - pull_request to main: builds the same .deb set and uploads
#     per-architecture workflow artifacts for review/testing.
#   - tag push v*.*.*: publishes a stable release at that tag.
#   - workflow_dispatch: manual run for ad-hoc rebuilds.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      kernel_version: ${{ steps.meta.outputs.kernel_version }}
      zfs_version: ${{ steps.meta.outputs.zfs_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine release tag
        id: meta
        run: |
          set -euo pipefail
          KERNEL_VERSION="$(awk -F= '/^KERNEL_VERSION=/ {gsub(/[ \t]/,""); print $2; exit}' examples/smooth.env)"
          ZFS_VERSION="$(awk -F= '/^ZFS_VERSION=/ {gsub(/[ \t]/,""); print $2; exit}' examples/smooth.env)"
          SHORT_SHA="$(git rev-parse --short HEAD)"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            NAME="SmoothKernel ${TAG}"
            PRERELEASE=false
          else
            TAG="v${KERNEL_VERSION}-${SHORT_SHA}"
            NAME="SmoothKernel ${KERNEL_VERSION} (${SHORT_SHA})"
            PRERELEASE=true
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "kernel_version=${KERNEL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "zfs_version=${ZFS_VERSION}" >> "$GITHUB_OUTPUT"

  build:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - deb_arch: amd64
            runner: ubuntu-24.04
          - deb_arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libelf-dev libssl-dev libncurses-dev \
            libdw-dev pahole rsync debhelper kmod fakeroot dpkg-dev cpio xz-utils zstd \
            autoconf automake libtool gawk alien rpm rpm2cpio dh-python po-debconf \
            uuid-dev libudev-dev libblkid-dev libtirpc-dev libcurl4-openssl-dev \
            libaio-dev libattr1-dev libffi-dev zlib1g-dev libpam0g-dev \
            python3 python3-dev python3-cffi python3-setuptools python3-packaging \
            python3-distlib parted

      - name: Check ROCm kernel config
        run: make check-rocm-config

      - name: Seed build.env
        run: cp examples/smooth.env build.env

      # Signing material is written to a tmpfs-backed directory outside the
      # workspace so it is never picked up by artifact upload, and is removed
      # again by the cleanup step below (which runs even if the build fails).
      #
      # Fork PRs do not receive secrets. Those builds still run, but produce
      # unsigned developer artifacts — the release job refuses to publish them.
      - name: Materialize signing material
        id: signing
        env:
          MODULE_SIGNING_KEY_PEM: ${{ secrets.RAKUEN_MODULE_SIGNING_KEY }}
          SECUREBOOT_SIGNING_KEY_PEM: ${{ secrets.RAKUEN_SECUREBOOT_SIGNING_KEY }}
          SECUREBOOT_SIGNING_CERT_PEM: ${{ secrets.RAKUEN_SECUREBOOT_SIGNING_CERT }}
        run: |
          set -euo pipefail
          d="$(mktemp -d /dev/shm/signing.XXXXXX)"
          chmod 700 "$d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"

          have_modsig=0
          if [ -n "${MODULE_SIGNING_KEY_PEM:-}" ]; then
            printf '%s\n' "$MODULE_SIGNING_KEY_PEM" > "$d/module-signing.pem"
            chmod 600 "$d/module-signing.pem"
            have_modsig=1
          fi

          have_sb=0
          if [ -n "${SECUREBOOT_SIGNING_KEY_PEM:-}" ] && [ -n "${SECUREBOOT_SIGNING_CERT_PEM:-}" ]; then
            printf '%s\n' "$SECUREBOOT_SIGNING_KEY_PEM"  > "$d/sb.key"
            printf '%s\n' "$SECUREBOOT_SIGNING_CERT_PEM" > "$d/sb.crt"
            chmod 600 "$d/sb.key" "$d/sb.crt"
            have_sb=1
          elif [ -n "${SECUREBOOT_SIGNING_KEY_PEM:-}" ] || [ -n "${SECUREBOOT_SIGNING_CERT_PEM:-}" ]; then
            echo "::error::RAKUEN_SECUREBOOT_SIGNING_KEY and _CERT must both be set"
            exit 1
          fi

          echo "have_modsig=$have_modsig" >> "$GITHUB_OUTPUT"
          echo "have_sb=$have_sb"         >> "$GITHUB_OUTPUT"

          if [ "$have_modsig" = 1 ] && [ "$have_sb" = 1 ]; then
            echo "signed=1" >> "$GITHUB_OUTPUT"
            echo "Signing material present: modules + kernel image."
          else
            echo "signed=0" >> "$GITHUB_OUTPUT"
            echo "::warning::Signing secrets absent or incomplete (modules=$have_modsig, secureboot=$have_sb). Artifacts will be UNSIGNED developer builds and are not promotable."
          fi

      - name: Install signing tools
        if: steps.signing.outputs.have_sb == '1'
        run: sudo apt-get install -y sbsigntool

      - name: Build kernel
        env:
          MODULE_SIGNING_KEY: ${{ steps.signing.outputs.have_modsig == '1' && format('{0}/module-signing.pem', steps.signing.outputs.dir) || '' }}
          SECUREBOOT_SIGNING_KEY: ${{ steps.signing.outputs.have_sb == '1' && format('{0}/sb.key', steps.signing.outputs.dir) || '' }}
          SECUREBOOT_SIGNING_CERT: ${{ steps.signing.outputs.have_sb == '1' && format('{0}/sb.crt', steps.signing.outputs.dir) || '' }}
        run: make kernel DEB_ARCH=${{ matrix.deb_arch }} BUILD_THREADS="$(nproc)"

      # Runs regardless of build outcome so key material never outlives the job.
      - name: Scrub signing material
        if: always()
        run: rm -rf "${{ steps.signing.outputs.dir }}"

      - name: Build OpenZFS
        run: make zfs DEB_ARCH=${{ matrix.deb_arch }} BUILD_THREADS="$(nproc)"

      # Independent of the checks inside build-kernel.sh: this re-derives the
      # answer from the finished .deb, so a bug in the recipe's own verification
      # cannot wave a bad artifact through.
      - name: Verify signing gates (docs/signing.md)
        if: steps.signing.outputs.signed == '1'
        run: |
          set -euo pipefail
          sudo apt-get install -y sbsigntool >/dev/null

          img_deb="$(ls out/${{ matrix.deb_arch }}/linux-image-*.deb | head -1)"
          tmp="$(mktemp -d)"
          dpkg-deb -R "$img_deb" "$tmp"

          echo "--- gate: packaged module signer ---"
          # -print -quit, not `| head -1`: with pipefail set, find takes SIGPIPE
          # when head exits early and the step dies with no diagnostic.
          mod="$(find "$tmp/lib/modules" -name '*.ko*' -print -quit)"
          case "$mod" in
            *.xz)  xz -dk "$mod";  mod="${mod%.xz}"  ;;
            *.zst) zstd -dq -k "$mod"; mod="${mod%.zst}" ;;
          esac
          signer="$(modinfo -F signer "$mod" | head -1)"
          echo "signer: '$signer'"
          if [ -z "$signer" ]; then
            echo "::error::packaged module is unsigned"; exit 1
          fi
          if [ "$signer" = "Build time autogenerated kernel key" ]; then
            echo "::error::packaged module signed with ephemeral build key, not the release key"; exit 1
          fi

          echo "--- gate: kernel image Secure Boot signature ---"
          img="$(find "$tmp/boot" -maxdepth 1 -name 'vmlinuz-*' -print -quit)"
          sbverify --list "$img"
          if ! sbverify --list "$img" | grep -q 'signature'; then
            echo "::error::kernel image has no signature table"; exit 1
          fi
          echo "both build-time gates PASS"

      - name: Mark unsigned build
        if: steps.signing.outputs.signed != '1'
        run: |
          echo "::warning::This build is UNSIGNED and not promotable per docs/signing.md."
          mkdir -p "out/${{ matrix.deb_arch }}"
          cat > "out/${{ matrix.deb_arch }}/UNSIGNED-NOT-PROMOTABLE.txt" <<'EOF'
          These packages were built without release signing material.

          Packaged modules carry an ephemeral "Build time autogenerated kernel
          key" and the kernel image has no EFI signature, so it will be refused
          by shim on a Secure Boot machine ("bad shim signature").

          Valid for development and functional testing. NOT promotable to the
          apt repo. See docs/signing.md.
          EOF

      - name: Stage release artifacts
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.deb_arch }}"
          cp "out/${{ matrix.deb_arch }}"/*.deb "dist/${{ matrix.deb_arch }}/"
          (cd "dist/${{ matrix.deb_arch }}" && sha256sum *.deb > "SHA256SUMS.${{ matrix.deb_arch }}")
          ls -lh "dist/${{ matrix.deb_arch }}/"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.deb_arch }}
          path: dist/${{ matrix.deb_arch }}
          if-no-files-found: error
          # Transient hand-off to the `release` job in the same run (which
          # publishes the .debs to a durable GitHub Release). Without a short
          # retention these ~250MB-1GB uploads linger 90 days and pile up — they
          # blew the org's 2GB Actions-storage cap. One day is well over a run's
          # duration; the durable copy lives in Releases.
          retention-days: 1

  release:
    needs: [meta, build]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Download package artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-input

      - name: Merge release artifacts
        run: |
          set -euo pipefail
          mkdir -p dist

          for arch in amd64 arm64; do
            src="release-input/packages-${arch}"
            test -d "$src"
            for f in "$src"/*.deb; do
              name="$(basename "$f")"
              if [[ "$name" == *_all.deb && -e "dist/$name" ]]; then
                echo "Skipping duplicate arch-all package from ${arch}: $name"
                continue
              fi
              if [[ -e "dist/$name" ]]; then
                echo "ERROR: duplicate release asset name: $name" >&2
                exit 1
              fi
              cp "$f" dist/
            done
          done

          (cd dist && sha256sum *.deb > SHA256SUMS)

          # manifest.json lets consumers discover what's in the release
          # without parsing filenames. Lists every .deb and its sha256.
          {
            printf '{\n'
            printf '  "tag": "%s",\n' "${{ needs.meta.outputs.tag }}"
            printf '  "kernel_version": "%s",\n' "${{ needs.meta.outputs.kernel_version }}"
            printf '  "zfs_version": "%s",\n' "${{ needs.meta.outputs.zfs_version }}"
            printf '  "commit": "%s",\n' "${GITHUB_SHA}"
            printf '  "architectures": ["amd64", "arm64"],\n'
            printf '  "artifacts": [\n'
            first=1
            for f in dist/*.deb; do
              name="$(basename "$f")"
              arch="${name%.deb}"
              arch="${arch##*_}"
              sha="$(sha256sum "$f" | awk '{print $1}')"
              [ "$first" = "1" ] || printf ',\n'
              first=0
              printf '    {"name": "%s", "architecture": "%s", "sha256": "%s"}' "$name" "$arch" "$sha"
            done
            printf '\n  ]\n'
            printf '}\n'
          } > dist/manifest.json

          ls -lh dist/

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.name }}
          draft: false
          prerelease: ${{ needs.meta.outputs.prerelease }}
          files: |
            dist/*.deb
            dist/SHA256SUMS
            dist/manifest.json
          generate_release_notes: true
